<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>

        <div class="grid grid-2">
            <div class="card">
                <div class="card-header">
                    <h3><i class="bi bi-shield-lock me-2" style="color:#00ffb4"></i>Security Settings</h3>
                </div>
                <div class="mb-3">
                    <label class="form-label">Session Timeout (hours)</label>
                    <input class="form-control" value="12" disabled>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" checked id="mfaToggle">
                    <label class="form-check-label" for="mfaToggle">Require MFA for admin accounts</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" checked id="notifToggle">
                    <label class="form-check-label" for="notifToggle">Enable security notifications</label>
                </div>
                <button class="btn-cyber" onclick="toast('Settings saved')"><i class="bi bi-check-circle me-1"></i>Save Settings</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3><i class="bi bi-building me-2" style="color:#00b4ff"></i>Organization</h3>
                </div>
                <div class="mb-3">
                    <label class="form-label">Organization Name</label>
                    <input class="form-control" value="CyberSec Enterprises">
                </div>
                <div class="mb-3">
                    <label class="form-label">Default Risk Threshold</label>
                    <select class="form-select">
                        <option>Low: < 40%</option>
                        <option selected>Medium: 40-70%</option>
                        <option>High: > 70%</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Campaign Frequency</label>
                    <select class="form-select">
                        <option>Monthly</option>
                        <option selected>Quarterly</option>
                        <option>Annually</option>
                    </select>
                </div>
                <button class="btn-outline-cyber" onclick="toast('Organization settings saved')"><i class="bi bi-check-circle me-1"></i>Save</button>
            </div>
        </div>

        <div class="card" style="margin-top:18px;">
            <div class="card-header">
                <h3><i class="bi bi-info-circle me-2" style="color:#ab66ff"></i>System Information</h3>
            </div>
            <div class="grid grid-3">
                <div><div class="text-muted small">Version</div><strong>2.0.1</strong></div>
                <div><div class="text-muted small">Database</div><strong>SQLite</strong></div>
                <div><div class="text-muted small">Auth</div><strong>JWT</strong></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/admin.js"></script>
<script>
    initSidebar('settings');
    initTopbar();
    setPageTitle('Settings','Platform configuration');
</script>
</body>
</html>
