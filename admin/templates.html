<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Templates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/admin.css?v=2">
    <style>
        body{font-family:'Inter','Poppins',system-ui,sans-serif;}
        .template-table{font-family:'Inter','Poppins',system-ui,sans-serif;}
/* Force strict column containment — no text spillover between columns */
        .template-table{table-layout:fixed;width:100%;}
        .template-table th,.template-table td{
            overflow:hidden;
            max-width:0;min-width:0;
        }
        /* Text cells truncate with ellipsis */
        .template-table td.cell-truncate,
        .template-table .cell-ellipsis,
        .template-table .template-name,
        .template-table .cell-subject,
        .template-table .cell-sender{
            display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        }
        /* Suspicious indicators cell wraps badges normally */
        .template-table td.cell-sus-wrap{overflow:hidden;white-space:normal;}
        .template-table td.cell-sus-wrap .sus-badges{flex-wrap:wrap;}
        /* Actions cell fits buttons without clipping */
        .template-table td.cell-center{overflow:visible !important;}
        .template-table td .action-group{overflow:visible !important;flex-wrap:nowrap;}
        .template-table .col-actions .action-group{min-width:170px;}
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>

        <div class="card" style="padding:0;overflow:hidden;">
            <div class="card-header" style="padding:20px 24px;margin:0;border-bottom:1px solid var(--border);">
                <h3><i class="bi bi-envelope-paper" style="color:#00b4ff"></i>Email Template Management</h3>
                <div class="card-header-actions">
                    <button class="btn-cyber" data-bs-toggle="modal" data-bs-target="#templateModal" onclick="openAddTemplate()">
                        <i class="bi bi-plus-circle"></i>New Template
                    </button>
                </div>
            </div>
            <div class="table-wrap" style="padding:16px 20px;">
<table class="template-table">
                    <colgroup>
                        <col class="col-template">
                        <col class="col-subject">
                        <col class="col-sender">
                        <col class="col-sus">
                        <col class="col-actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="col-template">Template</th>
                            <th class="col-subject">Subject</th>
                            <th class="col-sender">Sender</th>
                            <th class="col-sus">Suspicious Indicators</th>
                            <th class="col-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="templateBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Template Modal -->
<div class="modal fade" id="templateModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="templateModalTitle">Create Template</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="templateId">
                <div class="mb-3">
                    <label class="form-label">Template Name</label>
                    <input class="form-control" id="tName" placeholder="Fake password expiry">
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Email Subject</label>
                        <input class="form-control" id="tSubject" placeholder="IMPORTANT: Action required">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Sender Information</label>
                        <input class="form-control" id="tSender" placeholder="no-reply@secure-verify.net">
                    </div>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label">Message Content</label>
                    <textarea class="form-control" id="tContent" rows="3" placeholder="Email body content..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Suspicious Elements</label>
                    <textarea class="form-control" id="tSuspicious" rows="2" placeholder="e.g. unknown sender, urgent tone, fake link"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Awareness Explanation</label>
                    <textarea class="form-control" id="tAwareness" rows="2" placeholder="What users should learn from this"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Preview</label>
                    <div id="previewBox" class="template-preview-email"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-outline-cyber" data-bs-dismiss="modal">Cancel</button>
                <button class="btn-cyber" onclick="saveTemplate()"><i class="bi bi-check-circle me-1"></i>Save Template</button>
            </div>
        </div>
    </div>
</div>

<!-- Preview Modal -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-eye me-2" style="color:#00ffb4"></i>Email Preview</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="fullPreviewBox" class="template-preview-email"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/admin.js"></script>
<script>
    initSidebar('templates');
    initTopbar();
    setPageTitle('Email Templates','Design phishing simulation email templates');

// Map suspicious indicators text to badge tags
    const SUSPICIOUS_MAP = [
        {keywords:['urgent','imm(ed)?iat','expires','expir','24 hours','deadline','limited','asap'], label:'Urgent', icon:'bi-exclamation-triangle', cls:'urgent'},
        {keywords:['unknown sender','unknown domain','mismatch','no-reply','no reply','sender','suspicious sender'], label:'Unknown Sender', icon:'bi-person-exclamation', cls:'sender'},
        {keywords:['fake link','link','url','href','click here','click the link','suspicious link','destination'], label:'Fake Link', icon:'bi-link-45deg', cls:'link'},
        {keywords:['password','reset','credential','log in','login','keep your current password'], label:'Password Reset', icon:'bi-key', cls:'password'},
        {keywords:['verify','verification','confirm','suspended','suspension','unusual activity','identity'], label:'Verify Account', icon:'bi-shield-exclamation', cls:'verify'},
        {keywords:['security alert','alert','unusual login','new device','secure your account'], label:'Security Alert', icon:'bi-bell', cls:'alert'},
        {keywords:['reward','gift card','prize','won','claim','congratulations','selected'], label:'Reward Scam', icon:'bi-gift', cls:'reward'},
    ];

    function extractIndicators(text){
        if(!text) return [];
        const lower = String(text).toLowerCase();
        const found = [];
        for(const item of SUSPICIOUS_MAP){
            if(item.keywords.some(k=>lower.match(new RegExp(k)))){
                found.push(item);
            }
        }
        // Deduplicate
        return found.filter((v,i,a)=>a.findIndex(x=>x.label===v.label)===i);
    }

    function indicatorBadges(text){
        const items = extractIndicators(text);
        if(!items.length) return `<span style="color:var(--text2);font-size:.8rem;">—</span>`;
        return `<div class="sus-badges">` + items.map(i=>`
            <span class="sus-badge ${i.cls}" title="${i.label}"><i class="bi ${i.icon}"></i>${i.label}</span>
        `).join('') + `</div>`;
    }

    document.addEventListener('input', e=>{
        if(['tSubject','tSender','tContent'].includes(e.target.id)) updatePreview();
    });

    function updatePreview(){
        const subject = document.getElementById('tSubject').value || 'Email Subject';
        const sender = document.getElementById('tSender').value || 'sender@example.com';
        const content = document.getElementById('tContent').value || 'Email content preview...';
        document.getElementById('previewBox').innerHTML = `
            <div class="preview-from">From: <span style="color:#ff6b6b">${esc(sender)}</span></div>
            <div class="preview-subject">${esc(subject)}</div>
            <div class="preview-body">${esc(content)}</div>
        `;
    }

    async function loadTemplates(){
        const temps = await apiFetch('/api/admin/templates');
        const tbody = document.getElementById('templateBody');
        if(!temps.length){
            tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="bi bi-envelope-paper"></i>No templates yet</div></td></tr>`;
            return;
        }
        tbody.innerHTML = temps.map(t=>{
            const name = t.name || '';
            const subject = t.subject || '';
            const sender = t.sender || '';
            const suspicious = t.suspicious || '';
            const badges = indicatorBadges(suspicious);
return `
                <tr>
                    <td data-label="Template" class="col-template cell-truncate"><span class="cell-ellipsis template-name" title="${esc(name)}">${esc(name)}</span></td>
                    <td data-label="Subject" class="col-subject cell-truncate"><span class="cell-ellipsis cell-subject" title="${esc(subject)}">${esc(subject)}</span></td>
                    <td data-label="Sender" class="col-sender cell-truncate"><span class="cell-ellipsis cell-sender" title="${esc(sender)}">${esc(sender)}</span></td>
                    <td data-label="Indicators" class="col-sus cell-sus-wrap">${badges}</td>
                    <td data-label="Actions" class="col-actions">
                        <div class="action-group">
                            <button class="btn-icon edit" onclick='openEditTemplate(${t.template_id})' title="Edit" aria-label="Edit"><i class="bi bi-pencil"></i></button>
                            <button class="btn-icon green" onclick='previewTemplate(${t.template_id})' title="Preview" aria-label="Preview"><i class="bi bi-eye"></i></button>
                            <button class="btn-icon purple" onclick='duplicateTemplate(${t.template_id})' title="Duplicate" aria-label="Duplicate"><i class="bi bi-copy"></i></button>
                            <button class="btn-icon del" onclick="deleteTemplate(${t.template_id})" title="Delete" aria-label="Delete"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

function openAddTemplate(){
        document.getElementById('templateModalTitle').textContent = 'Create Template';
        document.getElementById('templateId').value='';
        ['tName','tSubject','tSender','tContent','tSuspicious','tAwareness'].forEach(id=>document.getElementById(id).value='');
        updatePreview();
    }

async function openEditTemplate(id){
        try{
            const temps = await apiFetch('/api/admin/templates');
            const t = temps.find(x=>x.template_id===id);
            if(!t) throw new Error('Template not found');
            document.getElementById('templateModalTitle').textContent = 'Edit Template';
            document.getElementById('templateId').value = t.template_id;
            document.getElementById('tName').value = t.name || '';
            document.getElementById('tSubject').value = t.subject || '';
            document.getElementById('tSender').value = t.sender || '';
            document.getElementById('tContent').value = t.content || '';
            document.getElementById('tSuspicious').value = t.suspicious || '';
            document.getElementById('tAwareness').value = t.awareness || '';
            updatePreview();
            var m = bootstrap.Modal.getOrCreateInstance(document.getElementById('templateModal'));
            m.show();
        }catch(e){ toast(e.message,'danger'); }
    }

    async function previewTemplate(id){
        try{
            const temps = await apiFetch('/api/admin/templates');
            const t = temps.find(x=>x.template_id===id);
            if(!t) throw new Error('Template not found');
            document.getElementById('fullPreviewBox').innerHTML = `
                <div class="preview-from">From: <span style="color:#ff6b6b">${esc(t.sender||'')}</span></div>
                <div class="preview-subject">${esc(t.subject||'')}</div>
                <div class="preview-body">${esc(t.content||'')}</div>
                ${t.suspicious ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #1e3a52;">
                    <div style="font-size:.72rem;color:var(--text2);font-weight:700;text-transform:uppercase;margin-bottom:6px;">Suspicious Indicators</div>
                    ${indicatorBadges(t.suspicious)}
                </div>` : ''}
                ${t.awareness ? `<div style="margin-top:12px;color:#2ed573;font-size:.82rem;"><i class="bi bi-lightbulb me-1"></i>${esc(t.awareness)}</div>` : ''}
            `;
            var m = bootstrap.Modal.getOrCreateInstance(document.getElementById('previewModal'));
            m.show();
        }catch(e){ toast(e.message,'danger'); }
    }

    async function duplicateTemplate(id){
        try{
            const temps = await apiFetch('/api/admin/templates');
            const t = temps.find(x=>x.template_id===id);
            if(!t) throw new Error('Template not found');
            const payload = {
                name: (t.name||'') + ' (Copy)',
                subject: t.subject||'',
                sender: t.sender||'',
                content: t.content||'',
                suspicious: t.suspicious||'',
                awareness: t.awareness||''
            };
            await apiFetch('/api/admin/templates', {method:'POST', body:JSON.stringify(payload)});
            toast('Template duplicated');
            loadTemplates();
        }catch(e){ toast(e.message,'danger'); }
    }

    async function saveTemplate(){
        const id = document.getElementById('templateId').value;
        const payload = {
            name:document.getElementById('tName').value,
            subject:document.getElementById('tSubject').value,
            sender:document.getElementById('tSender').value,
            content:document.getElementById('tContent').value,
            suspicious:document.getElementById('tSuspicious').value,
            awareness:document.getElementById('tAwareness').value
        };
        try{
            if(id){
                await apiFetch('/api/admin/templates/'+id, {method:'PUT', body:JSON.stringify(payload)});
                toast('Template updated');
            }else{
                await apiFetch('/api/admin/templates', {method:'POST', body:JSON.stringify(payload)});
                toast('Template created');
            }
            bootstrap.Modal.getInstance(document.getElementById('templateModal')).hide();
            loadTemplates();
        }catch(e){ toast(e.message,'danger'); }
    }

    async function deleteTemplate(id){
        if(!confirm('Delete this template?')) return;
        try{
            await apiFetch('/api/admin/templates/'+id, {method:'DELETE'});
            toast('Template deleted');
            loadTemplates();
        }catch(e){ toast(e.message,'danger'); }
    }

    loadTemplates().catch(e=>toast(e.message,'danger'));
</script>
</body>
</html>
</content>
