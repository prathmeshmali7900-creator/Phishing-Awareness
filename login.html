<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Dashboard - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
        :root{
            --text-primary:#FFFFFF;
            --text-secondary:rgba(255,255,255,0.7);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',system-ui,sans-serif;
            min-height:100vh;
            background: linear-gradient(135deg,#0a0e1a 0%, #0f1b2d 45%, #0d1a2b 100%);
            display:flex; align-items:center; justify-content:center;
            color:var(--text-primary);
        }
        .grid-bg {
            position:fixed; inset:0; z-index:0;
            background-image:
                linear-gradient(rgba(0,255,180,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,180,.04) 1px, transparent 1px);
            background-size:42px 42px;
        }
        .login-card {
            position:relative; z-index:1;
            background:rgba(16,24,40,.85);
            border:1px solid rgba(0,255,180,.25);
            border-radius:18px;
            padding:40px 36px;
            width:100%; max-width:420px;
            box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(0,255,180,.06);
            backdrop-filter: blur(8px);
        }
        .logo-circle {
            width:64px;height:64px;border-radius:16px;
            background:linear-gradient(135deg,#00ffb4,#00b4ff);
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 18px; font-size:30px; color:#06121f;
            box-shadow:0 0 30px rgba(0,255,180,.4);
        }
.login-card h1 { font-size:1.5rem; font-weight:700; color:var(--text-primary); text-align:center; }
        .login-card .sub { text-align:center; color:var(--text-secondary); font-size:.85rem; margin-bottom:26px; }
        .form-control {
            background:rgba(10,20,35,.7); border:1px solid #1e3a52;
            color:var(--text-primary); border-radius:10px; padding:.7rem 1rem;
        }
        .form-control:focus { background:rgba(10,20,35,.9); border-color:#00ffb4; box-shadow:0 0 0 .2rem rgba(0,255,180,.15); color:#fff; }
        .form-label { font-size:.8rem; color:var(--text-secondary); font-weight:600; }
        .btn-grad {
            background:linear-gradient(135deg,#00ffb4,#00b4ff);
            border:none; color:#06121f; font-weight:700; border-radius:10px; padding:.75rem;
            width:100%; transition:.2s;
        }
        .btn-grad:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,255,180,.35); color:#06121f; }
        .alert { border-radius:10px; font-size:.85rem; }
.demo-box { background:rgba(0,255,180,.06); border:1px dashed rgba(0,255,180,.3); border-radius:10px; padding:12px; font-size:.78rem; color:var(--text-secondary); margin-top:18px; }
        .tab-btn { background:none; border:none; color:var(--text-secondary); font-weight:600; padding:8px 18px; border-radius:8px; }
        .text-muted{color:var(--text-secondary) !important;}
        ::placeholder{color:rgba(255,255,255,0.55) !important;}
        .tab-btn.active { background:rgba(0,255,180,.12); color:#00ffb4; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="login-card">
        <div class="logo-circle"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>CyberSec <span style="color:#00ffb4">Dashboard</span></h1>
        <p class="sub">Phishing Awareness &amp; Training Platform</p>

        <div class="text-center mb-3">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="tabReg" onclick="switchTab('register')">Register</button>
        </div>

        <div id="alertBox"></div>

        <!-- Login form -->
        <form id="loginForm" onsubmit="submitLogin(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="you@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-grad"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
        </form>

        <!-- Register form -->
        <form id="registerForm" class="d-none" onsubmit="submitRegister(event)">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="you@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" id="regDept" placeholder="CompSci">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-grad"><i class="bi bi-person-plus me-2"></i>Create Account</button>
        </form>

        <div class="demo-box">
            <strong><i class="bi bi-info-circle me-1"></i>Demo Accounts</strong><br>
            <span class="text-muted">Admin:</span> admin@cybersec.com / admin123<br>
            <span class="text-muted">User:</span> alice@example.com / user123
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchTab(tab){
            document.getElementById('loginForm').classList.toggle('d-none', tab!=='login');
            document.getElementById('registerForm').classList.toggle('d-none', tab!=='register');
            document.getElementById('tabLogin').classList.toggle('active', tab==='login');
            document.getElementById('tabReg').classList.toggle('active', tab==='register');
            document.getElementById('alertBox').innerHTML='';
        }
        function showAlert(msg, type){
            document.getElementById('alertBox').innerHTML =
                `<div class="alert alert-${type} mt-2">${msg}</div>`;
        }
        async function submitLogin(e){
            e.preventDefault();
            const email=document.getElementById('loginEmail').value;
            const password=document.getElementById('loginPassword').value;
            try{
                const res=await fetch('/api/auth/login',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({email,password})
                });
                const data=await res.json();
                if(!res.ok){ showAlert(data.error||'Login failed','danger'); return; }
                localStorage.setItem('token',data.token);
                localStorage.setItem('role',data.role);
                localStorage.setItem('name',data.name);
                window.location.href = data.role==='admin' ? '/admin/dashboard.html' : '/user/dashboard.html';
            }catch(err){ showAlert('Server error','danger'); }
        }
        async function submitRegister(e){
            e.preventDefault();
            const payload={
                name:document.getElementById('regName').value,
                email:document.getElementById('regEmail').value,
                department:document.getElementById('regDept').value,
                password:document.getElementById('regPassword').value
            };
            try{
                const res=await fetch('/api/auth/register',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(payload)
                });
                const data=await res.json();
                if(!res.ok){ showAlert(data.error||'Registration failed','danger'); return; }
                showAlert('Account created! Please sign in.','success');
                switchTab('login');
            }catch(err){ showAlert('Server error','danger'); }
        }
    </script>
</body>
</html>
