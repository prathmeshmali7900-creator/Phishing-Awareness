<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/user.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>

        <div class="grid grid-3" id="perfCards"></div>

        <div class="grid grid-2" style="margin-top:18px;">
            <div class="card">
<div class="card-header"><h3><i class="bi bi-shield-check me-2" style="color:var(--primary)"></i>Overall Performance</h3></div>
                <div id="scoreRing"></div>
                <div class="text-center mt-3" id="riskBadge"></div>
            </div>
            <div class="card">
<div class="card-header"><h3><i class="bi bi-exclamation-triangle me-2" style="color:var(--danger)"></i>Mistake Analysis</h3></div>
                <div id="mistakeList"></div>
            </div>
        </div>

        <div class="card" style="margin-top:18px;">
<div class="card-header"><h3><i class="bi bi-lightbulb me-2" style="color:var(--purple)"></i>Recommendation</h3></div>
            <div id="recommendation"></div>
        </div>

        <div class="card" style="margin-top:18px;">
            <div class="card-header"><h3><i class="bi bi-clock-history me-2" style="color:var(--primary2)"></i>Simulation History</h3></div>
            <div class="table-wrap">
                <table class="table align-middle">
                    <thead><tr><th>Campaign</th><th>Action</th><th>Score</th><th>Timestamp</th></tr></thead>
                    <tbody id="simHistory"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/user.js"></script>
<script>
    initSidebar('results');
    initTopbar();
    setPageTitle('My Results','Track your performance & improvements');

    async function loadResults(){
        const d = await apiFetch('/api/user/results');
        const user = d.user;

        const cards = [
            {icon:'blue', bi:'bi-envelope-at', value:d.simulations.length, label:'Completed Simulations'},
            {icon:'purple', bi:'bi-trophy', value:d.correct_rate+'%', label:'Correct Identification Rate'},
            {icon:'cyan', bi:'bi-journal-check', value:d.quizzes.length, label:'Quizzes Taken'},
        ];
        document.getElementById('perfCards').innerHTML = cards.map(c=>`
            <div class="card stat-card">
                <div class="icon ${c.icon}"><i class="bi ${c.bi}"></i></div>
                <div class="value">${c.value}</div>
                <div class="label">${c.label}</div>
            </div>
        `).join('');

const color = user.risk_level==='Low' ? '#2ed573' : (user.risk_level==='High' ? '#ff6b6b' : '#ffc048');
        scoreRing('#scoreRing', user.awareness_score, color);
        document.getElementById('riskBadge').innerHTML = `Security Level: ${riskBadge(user.risk_level)}`;

        const ml = document.getElementById('mistakeList');
        if(!d.mistakes.length){
            ml.innerHTML = `<div class="text-muted small"><i class="bi bi-check-circle text-success me-1"></i>No mistakes detected. Great job!</div>`;
        }else{
            ml.innerHTML = d.mistakes.map(m=>`
                <div class="d-flex align-items-start gap-2 mb-2">
                    <i class="bi bi-x-circle text-danger mt-1"></i>
                    <span>${esc(m)}</span>
                </div>
            `).join('');
        }

        document.getElementById('recommendation').innerHTML = `
            <div class="d-flex align-items-start gap-3">
                <div class="lesson-icon"><i class="bi bi-lightbulb"></i></div>
                <div>
                    <strong>${esc(d.recommendation)}</strong>
                    <p class="text-muted small mb-0 mt-1">Continue practicing phishing identification techniques and complete all training modules.</p>
                </div>
            </div>
        `;

        const hist = document.getElementById('simHistory');
        if(!d.simulations.length){
            hist.innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="bi bi-clock-history"></i>No simulations yet</div></td></tr>`;
        }else{
            hist.innerHTML = d.simulations.map(s=>`
                <tr>
                    <td>Campaign #${s.campaign_id}</td>
                    <td>
                        ${s.reported?'<span class="badge-risk risk-low">Reported</span>':''}
                        ${s.link_clicked?'<span class="badge-risk risk-high">Clicked</span>':''}
${s.email_opened?'<span class="badge-risk status-scheduled">Opened</span>':''}
                    </td>
                    <td><strong>${s.score}%</strong></td>
                    <td class="text-muted small">${s.timestamp}</td>
                </tr>
            `).join('');
        }
    }

    loadResults().catch(e=>toast(e.message,'danger'));
</script>
</body>
</html>
